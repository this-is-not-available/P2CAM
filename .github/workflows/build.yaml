name: Build Application

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Application
      run: dotnet publish P2CAM.UI.Avalonia/P2CAM.UI.Avalonia.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish-out

      # Windows specific build steps
    - name: Rename executable with version
      shell: powershell
      if: matrix.os == 'windows-latest'
      run: |
        mkdir dist
        copy ./publish-out/P2CAM.Avalonia.exe dist/P2CAM-${{ github.ref_name }}-${{ matrix.runtime }}.exe

      # Linux specific build steps
    - name: Install appimagetool
      shell: bash
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Build AppImage
      shell: bash
      if: matrix.os == 'ubuntu-latest'
      run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/metainfo
          mkdir -p AppDir/usr/share/applications
          cp ./publish-out/P2CAM.Avalonia ./AppDir/usr/bin/P2CAM.Avalonia
          cp ./P2CAM.UI.Avalonia/Assets/p2cam.png ./AppDir/p2cam.png
          cp ./P2CAM.UI.Avalonia/Assets/p2cam.svg ./AppDir/p2cam.svg
          cp ./P2CAM.UI.Avalonia/AppRun ./AppDir/AppRun
          cp ./P2CAM.UI.Avalonia/p2cam.desktop ./AppDir/usr/share/applications/io.github.this_is_not_available.P2CAM.desktop
          cp ./P2CAM.UI.Avalonia/p2cam.appdata.xml ./AppDir/usr/share/metainfo/io.github.this_is_not_available.P2CAM.appdata.xml
          ln ./AppDir/usr/share/applications/io.github.this_is_not_available.P2CAM.desktop ./AppDir/io.github.this_is_not_available.P2CAM.desktop
          chmod +x ./AppDir/AppRun ./AppDir/usr/bin/P2CAM.Avalonia
          sed -i '1s/^.*#/#/;s/\r$//' ./AppDir/AppRun
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run ./AppDir P2CAM-${{ github.ref_name }}-${{ matrix.runtime }}.AppImage
          mkdir dist
          mv P2CAM-${{ github.ref_name }}-${{ matrix.runtime }}.AppImage dist/

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*